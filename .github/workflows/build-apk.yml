name: 打包 APK

# 推送 v* tag 时自动打 release APK 并发布到 GitHub Release;
# 也可在 Actions 页面手动触发(workflow_dispatch)构建当前分支快照
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉全量历史和 tag,供版本号推导

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/ecode.jks
          else
            echo "未配置 KEYSTORE_BASE64,本次产物为未签名 release APK,无法直接安装"
          fi

      - name: 构建 Release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/ecode.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 用版本号重命名 APK
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/Ecode-${GITHUB_REF_NAME#v}.apk"
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
